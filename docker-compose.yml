version: '3.9'

services:
  web:
    build: .
    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=backend.settings
      - DEBUG=1
    env_file:
      - .env

  redis:
    image: redis:7
    ports:
      - "6379:6379"


  celery-training:
    build: .
    command: celery -A backend worker --loglevel=info --pool=prefork --concurrency=4 -Q training
    volumes:
      - .:/app
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=backend.settings
    env_file:
      - .env
